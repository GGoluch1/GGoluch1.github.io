<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Production builds get a Content-Security-Policy meta tag here (see vite.config.js). -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050407" />
    <!-- Plain wording on purpose: this is what Google shows in search results. -->
    <title>Gabriel Goluch · Computer Engineering, University of Florida</title>
    <meta
      name="description"
      content="Gabriel Goluch is a computer engineering student at the University of Florida. Projects, code, and links to GitHub, LinkedIn and X."
    />
    <meta name="author" content="Gabriel Goluch" />
    <link rel="canonical" href="https://gabrielgoluch.me/" />

    <!-- Link previews (LinkedIn, Discord, iMessage, X…) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Gabriel Goluch" />
    <meta property="og:url" content="https://gabrielgoluch.me/" />
    <meta property="og:title" content="Gabriel Goluch // NERV" />
    <meta
      property="og:description"
      content="Computer engineering student at the University of Florida. Personal projects and links, served by the MAGI system."
    />
    <meta property="profile:first_name" content="Gabriel" />
    <meta property="profile:last_name" content="Goluch" />
    <meta property="og:image" content="https://gabrielgoluch.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAGI system screen reading Gabriel Goluch, access granted" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stormxtwo" />
    <meta name="twitter:creator" content="@stormxtwo" />
    <!-- Structured data (schema.org Person) is added at build time, see vite.config.js. -->

    <!--
      Noto Serif JP is huge, so we request only the characters the site uses.
      The text= list is filled in by the subsetTitleFont plugin in vite.config.js.
      media="print" downloads the font CSS without blocking the first paint;
      src/main.jsx switches it to "all" (no inline onload, so the CSP can stay strict).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&text=%TITLE_FONT_TEXT%&display=swap"
      rel="stylesheet"
      media="print"
      data-async-font
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
      media="print"
      data-async-font
    />
    <!--
      Without JavaScript the page is the prerendered HTML: this hides the boot
      screen and shows everything that would otherwise animate in. It's a file
      rather than an inline <style> so the CSP can stay strict.
    -->
    <noscript><link rel="stylesheet" href="/noscript.css" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
