<!doctype html>
<!--
  Source for the home-screen icons: public/apple-touch-icon.png (180),
  public/icon-192.png and public/icon-512.png. The same design as
  public/favicon.svg, kept inside the middle 80% so it also works as a
  "maskable" icon that Android crops to a circle. Regenerate with the
  headless Chrome commands in README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&text=G&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #050407;
      }
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" fill="#050407" />
      <path d="M50 14 81 32v36L50 86 19 68V32z" fill="none" stroke="#ff8a1f" stroke-width="4.5" />
      <path d="M50 22 74 36v28L50 78 26 64V36z" fill="none" stroke="#ff8a1f" stroke-width="1" opacity="0.4" />
      <text
        x="50"
        y="62"
        text-anchor="middle"
        font-family="'Noto Serif JP', Georgia, serif"
        font-weight="900"
        font-size="36"
        fill="#ee1c33"
      >
        G
      </text>
    </svg>
  </body>
</html>
